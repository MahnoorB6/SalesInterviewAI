<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalesInterviewAI - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f7fb;
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        h1 span {
            color: #6366f1;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4f46e5;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            color: #dc2626;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Sales<span>InterviewAI</span></h1>

        <p class="subtitle">
            Sign in to your admin dashboard
        </p>

        <form id="loginForm">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div id="message"></div>

    </div>


    <script>

        const API_URL = "http://127.0.0.1:8000";

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");

                message.textContent = "Logging in...";


                const formData = new URLSearchParams();

                formData.append("username", email);
                formData.append("password", password);


                try {

                    const response = await fetch(
                        API_URL + "/api/auth/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/x-www-form-urlencoded"
                            },

                            body: formData
                        }
                    );


                    const data = await response.json();


                    if (!response.ok) {

                        message.textContent =
                            data.detail || "Login failed.";

                        return;
                    }


                    localStorage.setItem(
                        "access_token",
                        data.access_token
                    );


                    window.location.href =
                        "dashboard.html";


                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Cannot connect to the server.";

                }

            });

    </script>

</body>
</html>
