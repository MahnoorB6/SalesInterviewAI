<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>SalesInterviewAI - Google Authorization</title>

<style>
    :root {
        --cream: #FFFDF8;
        --cream-soft: #FAF7F2;
        --lavender: #F3EEFF;
        --lavender-deep: #E9DFFF;
        --rose: #EFA7B8;
        --rose-light: #FCE7ED;
        --rose-dark: #C85D7A;
        --purple: #7653B8;
        --purple-dark: #56358F;
        --purple-soft: #EEE7FA;
        --text: #33283D;
        --text-dark: #241B2C;
        --text-muted: #7D7187;
        --border: #E9E0EA;
        --shadow: 0 8px 28px rgba(88, 55, 115, 0.07);
        --shadow-hover: 0 14px 34px rgba(88, 55, 115, 0.12);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
        background:
            radial-gradient(
                circle at 12% 15%,
                rgba(239, 167, 184, 0.22),
                transparent 28%
            ),
            radial-gradient(
                circle at 88% 82%,
                rgba(201, 182, 228, 0.28),
                transparent 30%
            ),
            linear-gradient(
                135deg,
                var(--cream) 0%,
                var(--cream-soft) 48%,
                var(--lavender) 100%
            );
        color: var(--text);
        overflow: hidden;
    }

    .background-decoration {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
    }

    .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(2px);
        opacity: 0.45;
    }

    .blob-one {
        width: 220px;
        height: 220px;
        top: -80px;
        left: -70px;
        background: var(--rose-light);
    }

    .blob-two {
        width: 260px;
        height: 260px;
        right: -100px;
        bottom: -100px;
        background: var(--lavender-deep);
    }

    .sparkle {
        position: absolute;
        color: var(--purple);
        font-size: 20px;
        opacity: 0.55;
        animation: floatSparkle 4s ease-in-out infinite;
    }

    .sparkle-one {
        top: 19%;
        left: 20%;
    }

    .sparkle-two {
        top: 72%;
        right: 21%;
        animation-delay: 1.2s;
    }

    .sparkle-three {
        top: 14%;
        right: 18%;
        font-size: 14px;
        animation-delay: 2s;
    }

    @keyframes floatSparkle {
        0%, 100% {
            transform: translateY(0) scale(1);
            opacity: 0.4;
        }

        50% {
            transform: translateY(-8px) scale(1.08);
            opacity: 0.75;
        }
    }

    .auth-box {
        position: relative;
        z-index: 2;
        width: 440px;
        max-width: 100%;
        padding: 44px 42px;
        background:
            linear-gradient(
                145deg,
                rgba(255, 255, 255, 0.97),
                rgba(255, 252, 250, 0.97)
            );
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: var(--shadow-hover);
        text-align: center;
    }

    .brand {
        position: relative;
        display: inline-block;
        margin-bottom: 14px;
    }

    .logo {
        font-size: 30px;
        line-height: 1.15;
        font-weight: 800;
        letter-spacing: -1px;
        color: var(--purple-dark);
    }

    .logo::after {
        content: "";
        position: absolute;
        left: 2px;
        bottom: -9px;
        width: 46px;
        height: 3px;
        border-radius: 10px;
        background:
            linear-gradient(
                90deg,
                var(--rose),
                var(--purple)
            );
    }

    .subtitle {
        margin-top: 22px;
        color: var(--text-muted);
        font-size: 15px;
        line-height: 1.6;
    }

    .google-button {
        width: 100%;
        margin-top: 30px;
        padding: 15px 20px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background:
            linear-gradient(
                135deg,
                var(--purple),
                var(--purple-dark)
            );
        color: white;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        box-shadow:
            0 8px 20px rgba(118, 83, 184, 0.18);
        transition:
            transform 0.22s ease,
            box-shadow 0.22s ease,
            filter 0.22s ease;
    }

    .google-button:hover {
        transform: translateY(-2px);
        box-shadow:
            0 12px 26px rgba(118, 83, 184, 0.25);
        filter: brightness(1.03);
    }

    .google-button:active {
        transform: translateY(0);
    }

    .button-content {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 11px;
    }

    .google-icon {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--purple-dark);
        font-size: 13px;
        font-weight: 800;
    }

    .info-card {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin-top: 25px;
        padding: 15px;
        text-align: left;
        background: var(--lavender);
        border: 1px solid var(--lavender-deep);
        border-radius: 12px;
    }

    .info-icon {
        flex-shrink: 0;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 9px;
        background: var(--rose-light);
        color: var(--rose-dark);
        font-size: 14px;
        font-weight: 700;
    }

    .info {
        color: var(--text-muted);
        font-size: 12.5px;
        line-height: 1.55;
    }

    .footer-text {
        margin-top: 22px;
        color: #A297A9;
        font-size: 11.5px;
    }

    @media (max-width: 520px) {
        body {
            padding: 20px;
        }

        .auth-box {
            padding: 36px 25px;
            border-radius: 18px;
        }

        .logo {
            font-size: 26px;
        }

        .subtitle {
            font-size: 14px;
        }
    }
</style>
```

</head>

<body>

```
<div class="background-decoration">
    <div class="blob blob-one"></div>
    <div class="blob blob-two"></div>

    <div class="sparkle sparkle-one">✦</div>
    <div class="sparkle sparkle-two">✧</div>
    <div class="sparkle sparkle-three">✦</div>
</div>

<div class="auth-box">

    <div class="brand">
        <div class="logo">
            SalesInterviewAI
        </div>
    </div>

    <p class="subtitle">
        Connect your Google account to continue
        to SalesInterviewAI.
    </p>

    <button
        class="google-button"
        type="button"
        onclick="connectGoogle()"
    >
        <span class="button-content">
            <span class="google-icon">G</span>
            <span>Continue with Google</span>
        </span>
    </button>

    <div class="info-card">
        <div class="info-icon">i</div>

        <p class="info">
            Google Calendar and Google Meet are required
            for interview scheduling and automated
            AI-powered interviews.
        </p>
    </div>

    <p class="footer-text">
        Secure Google authorization for SalesInterviewAI
    </p>

</div>

<script>
    function connectGoogle() {
        window.location.href =
            "http://127.0.0.1:8000/api/google/login";
    }
</script>


</body>
</html>
